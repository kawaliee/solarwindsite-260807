# =====================================================================
# 재생에너지 입지타당성 검토 시스템 — Docker Compose
# 서비스: PostgreSQL(Main DB) · Redis(외부 API 응답 캐시) ·
#        Django(backend) · React(frontend)
#
# Redis는 선택이 아니다 — 한 지점 검토가 외부 공간정보 API를 수십 건
# 호출하므로, 캐시가 없으면 같은 지점을 다시 볼 때마다 사용량 제한에 걸린다
# (settings.CACHES는 REDIS_URL이 없으면 프로세스 로컬 캐시로 내려간다).
# =====================================================================

services:
  postgres:
    image: postgres:16
    container_name: re_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-re_agent}
      POSTGRES_USER: ${POSTGRES_USER:-re_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-re_pass}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - re_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-re_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: re_redis
    ports:
      - "6379:6379"
    networks:
      - re_net

  backend:
    build: ./backend
    container_name: re_backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-re_user}:${POSTGRES_PASSWORD:-re_pass}@postgres:5432/${POSTGRES_DB:-re_agent}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - re_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: re_frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE: http://localhost:8000/api
      # 입지검토 배경지도(V-World WMTS)용. 브라우저가 직접 타일을 받으므로
      # 백엔드 키를 프런트로 넘겨준다. 키가 없어도 OpenTopoMap으로 지도는 뜬다.
      VITE_VWORLD_KEY: ${VWORLD_API_KEY:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - re_net
    depends_on:
      - backend

networks:
  re_net:
    driver: bridge

volumes:
  pg_data:
